[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thoughtquake"
version = "0.1.0"
description = "THOUGHTQUAKE local thought injection engine"
requires-python = ">=3.11"
dependencies = ["numpy", "aiohttp", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]
model = ["torch", "transformers>=4.46,<5"]

[project.scripts]
thoughtquake = "thoughtquake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thoughtquake.concepts" = ["concepts.yaml"]
"thoughtquake.overlay" = ["*.html", "*.css", "*.js", "fonts/*.ttf", "fonts/*.txt"]
"thoughtquake.sim" = ["demo_script.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not realmodel'"
markers = ["realmodel: requires explicitly enabled real model weights"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
